<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" style="background:#050505;font-family:system-ui,-apple-system,sans-serif">
  <!-- Header -->
  <rect x="0" y="0" width="1440" height="48" fill="#0a0a0a" stroke="#1f1f1f"/>
  <circle cx="20" cy="24" r="5" fill="#22d3ee"/>
  <text x="35" y="29" fill="#ffffff" font-size="14" font-weight="bold">Echo Nullity Desktop IDE</text>
  <rect x="180" y="14" width="90" height="20" rx="10" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.3)"/>
  <text x="192" y="28" fill="#22d3ee" font-size="10" font-family="monospace">ELECTRON V1.0</text>
  <text x="1250" y="29" fill="#22d3ee" font-size="12" font-family="monospace">TOMOGRAPHY ACTIVE</text>

  <!-- Left Sidebar Explorer -->
  <rect x="0" y="48" width="250" height="740" fill="#0a0a0a" stroke="#1f1f1f"/>
  <text x="15" y="75" fill="#6b7280" font-size="11" font-family="monospace" font-weight="bold">EXPLORER</text>
  <text x="15" y="105" fill="#22d3ee" font-size="12" font-family="monospace">v ai_cart_project</text>
  <text x="30" y="130" fill="#22d3ee" font-size="12" font-family="monospace">v src</text>
  <rect x="45" y="145" width="190" height="24" rx="4" fill="rgba(34,211,238,0.15)"/>
  <text x="50" y="161" fill="#22d3ee" font-size="12" font-family="monospace" font-weight="bold">cart_calculator.py</text>
  <text x="50" y="190" fill="#a1a1aa" font-size="12" font-family="monospace">checkout_engine.py</text>
  <text x="50" y="215" fill="#a1a1aa" font-size="12" font-family="monospace">invoice_processor.py</text>
  <text x="30" y="245" fill="#a1a1aa" font-size="12" font-family="monospace">nullity.toml</text>

  <!-- Center Monaco Editor -->
  <rect x="250" y="48" width="870" height="740" fill="#050505" stroke="#1f1f1f"/>
  <!-- Tabs -->
  <rect x="250" y="48" width="870" height="36" fill="#0a0a0a" stroke="#1f1f1f"/>
  <rect x="255" y="54" width="160" height="30" rx="4" fill="#050505" stroke="rgba(34,211,238,0.4)"/>
  <text x="270" y="73" fill="#22d3ee" font-size="12" font-family="monospace" font-weight="bold">cart_calculator.py</text>

  <!-- Code text -->
  <text x="275" y="115" fill="#8b5cf6" font-size="13" font-family="monospace">def calculate_cart_total(items, discount):</text>
  <text x="295" y="140" fill="#a1a1aa" font-size="13" font-family="monospace">subtotal = sum(item.price for item in items)</text>

  <!-- Highlighted Ghost Lines -->
  <rect x="250" y="155" width="870" height="26" fill="rgba(8,51,68,0.6)"/>
  <rect x="250" y="155" width="4" height="26" fill="#22d3ee"/>
  <text x="295" y="172" fill="#22d3ee" font-size="13" font-family="monospace" style="text-decoration:line-through">subtotal = subtotal * 1    # Identity Multiplication</text>

  <rect x="250" y="185" width="870" height="26" fill="rgba(8,51,68,0.6)"/>
  <rect x="250" y="185" width="4" height="26" fill="#22d3ee"/>
  <text x="295" y="202" fill="#22d3ee" font-size="13" font-family="monospace" style="text-decoration:line-through">subtotal = subtotal + 0    # Identity Addition</text>

  <rect x="250" y="215" width="870" height="26" fill="rgba(8,51,68,0.6)"/>
  <rect x="250" y="215" width="4" height="26" fill="#22d3ee"/>
  <text x="295" y="232" fill="#22d3ee" font-size="13" font-family="monospace" style="text-decoration:line-through">subtotal = subtotal - 0    # Identity Subtraction</text>

  <rect x="250" y="245" width="870" height="26" fill="rgba(8,51,68,0.6)"/>
  <rect x="250" y="245" width="4" height="26" fill="#22d3ee"/>
  <text x="295" y="262" fill="#22d3ee" font-size="13" font-family="monospace" style="text-decoration:line-through">subtotal = subtotal / 1    # Identity Division</text>

  <text x="295" y="295" fill="#a1a1aa" font-size="13" font-family="monospace">final_total = subtotal - discount</text>
  <text x="295" y="320" fill="#8b5cf6" font-size="13" font-family="monospace">return max(0, final_total)</text>

  <!-- Right Tomography Panel -->
  <rect x="1120" y="48" width="320" height="740" fill="#0a0a0a" stroke="#1f1f1f"/>
  <text x="1140" y="80" fill="#ffffff" font-size="14" font-weight="bold">Tomography Panel</text>
  <rect x="1330" y="65" width="90" height="22" rx="11" fill="rgba(34,211,238,0.15)"/>
  <text x="1340" y="80" fill="#22d3ee" font-size="11" font-family="monospace">Luminance: 0.00</text>

  <!-- Summary Card -->
  <rect x="1140" y="100" width="280" height="60" rx="8" fill="#050505" stroke="#1f1f1f"/>
  <text x="1155" y="125" fill="#a1a1aa" font-size="12" font-family="monospace">Causal Impact: <tspan fill="#22d3ee" font-weight="bold">0.00%</tspan></text>
  <text x="1155" y="145" fill="#a1a1aa" font-size="12" font-family="monospace">Ghost Lines Detected: <tspan fill="#8b5cf6" font-weight="bold">4</tspan></text>

  <!-- Findings Items -->
  <rect x="1140" y="180" width="280" height="70" rx="8" fill="#050505" stroke="rgba(34,211,238,0.4)"/>
  <text x="1155" y="202" fill="#22d3ee" font-size="12" font-family="monospace" font-weight="bold">Line 6: x * 1</text>
  <text x="1155" y="222" fill="#a1a1aa" font-size="11">Multiplying by 1 leaves output state identical.</text>

  <rect x="1140" y="260" width="280" height="70" rx="8" fill="#050505" stroke="rgba(34,211,238,0.4)"/>
  <text x="1155" y="282" fill="#22d3ee" font-size="12" font-family="monospace" font-weight="bold">Line 7: x + 0</text>
  <text x="1155" y="302" fill="#a1a1aa" font-size="11">Adding 0 leaves value invariant.</text>

  <!-- Safe Remove Button -->
  <rect x="1140" y="720" width="280" height="42" rx="21" fill="#22d3ee"/>
  <text x="1205" y="746" fill="#000000" font-size="13" font-weight="bold">Apply Safe Remove Surgery</text>

  <!-- Bottom Console Panel -->
  <rect x="0" y="788" width="1440" height="112" fill="#070707" stroke="#1f1f1f"/>
  <text x="20" y="810" fill="#22d3ee" font-size="11" font-family="monospace" font-weight="bold">IPC ENGINE CONSOLE LOGS</text>
  <text x="20" y="835" fill="#a1a1aa" font-size="11" font-family="monospace">[SYSTEM] Echo Nullity Desktop IDE Engine Initialized.</text>
  <text x="20" y="855" fill="#10b981" font-size="11" font-family="monospace">[ELECTRON] Context Bridge Connected.</text>
  <text x="20" y="875" fill="#22d3ee" font-size="11" font-family="monospace">[ENGINE] Python analyze.py executed in 24ms. 4 Ghost lines detected.</text>
</svg>
