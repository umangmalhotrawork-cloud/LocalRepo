<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" style="background:#050505;font-family:system-ui,-apple-system,sans-serif">
  <!-- Header -->
  <rect x="0" y="0" width="1440" height="48" fill="#0a0a0a" stroke="#1f1f1f"/>
  <circle cx="20" cy="24" r="5" fill="#22d3ee"/>
  <text x="35" y="29" fill="#ffffff" font-size="14" font-weight="bold">Echo Nullity Desktop IDE</text>
  <rect x="180" y="14" width="90" height="20" rx="10" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.3)"/>
  <text x="192" y="28" fill="#22d3ee" font-size="10" font-family="monospace">SURGERY V2.5</text>

  <!-- Main IDE Workspace -->
  <rect x="0" y="48" width="900" height="740" fill="#050505" stroke="#1f1f1f"/>
  <text x="280" y="100" fill="#8b5cf6" font-size="13" font-family="monospace">def calculate_cart_total(items, discount):</text>
  <text x="295" y="130" fill="#a1a1aa" font-size="13" font-family="monospace">subtotal = sum(item.price for item in items)</text>
  <text x="295" y="160" fill="#22d3ee" font-size="13" font-family="monospace" style="text-decoration:line-through">subtotal = subtotal * 1</text>
  <text x="295" y="190" fill="#22d3ee" font-size="13" font-family="monospace" style="text-decoration:line-through">subtotal = subtotal + 0</text>

  <!-- Right-Side Sliding Diff Drawer -->
  <rect x="900" y="48" width="540" height="740" fill="#0a0a0a" stroke="#22d3ee"/>
  <rect x="900" y="48" width="540" height="48" fill="#050505" stroke="#1f1f1f"/>
  <text x="920" y="77" fill="#ffffff" font-size="14" font-weight="bold">Safe Remove Preview</text>
  <rect x="1080" y="62" width="120" height="20" rx="4" fill="#083344"/>
  <text x="1090" y="76" fill="#22d3ee" font-size="11" font-family="monospace">cart_calculator.py</text>

  <!-- Metrics Banner -->
  <rect x="900" y="96" width="540" height="36" fill="rgba(8,51,68,0.3)" stroke="rgba(34,211,238,0.2)"/>
  <text x="920" y="118" fill="#a1a1aa" font-size="12" font-family="monospace">Ghost Lines: <tspan fill="#c084fc" font-weight="bold">4</tspan> &#8594; <tspan fill="#22d3ee" font-weight="bold">0</tspan></text>
  <rect x="1280" y="104" width="140" height="20" rx="4" fill="#2e1065"/>
  <text x="1290" y="118" fill="#c084fc" font-size="10" font-family="monospace">4 lines transformed</text>

  <!-- Diff Items -->
  <rect x="920" y="150" width="500" height="48" rx="6" fill="rgba(127,29,29,0.5)" stroke="#ef4444"/>
  <text x="935" y="178" fill="#fca5a5" font-size="12" font-family="monospace">- 6: subtotal = subtotal * 1</text>
  
  <rect x="920" y="205" width="500" height="48" rx="6" fill="rgba(6,78,59,0.5)" stroke="#10b981"/>
  <text x="935" y="233" fill="#6ee7b7" font-size="12" font-family="monospace">+ 6: subtotal = subtotal</text>

  <!-- Drawer Action Footer -->
  <rect x="900" y="730" width="540" height="58" fill="#0a0a0a" stroke="#1f1f1f"/>
  <rect x="920" y="742" width="100" height="36" rx="10" fill="#141414" stroke="#262626"/>
  <text x="948" y="764" fill="#a1a1aa" font-size="12" font-family="monospace">Cancel</text>

  <rect x="1280" y="742" width="140" height="36" rx="10" fill="#22d3ee"/>
  <text x="1305" y="764" fill="#000000" font-size="12" font-weight="bold">Apply Surgery</text>
</svg>
