<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" style="background:#050505;font-family:system-ui,-apple-system,sans-serif">
  <!-- Header -->
  <rect x="0" y="0" width="1440" height="48" fill="#0a0a0a" stroke="#1f1f1f"/>
  <circle cx="20" cy="24" r="5" fill="#10b981"/>
  <text x="35" y="29" fill="#ffffff" font-size="14" font-weight="bold">Echo Nullity Desktop IDE</text>
  <rect x="180" y="14" width="260" height="22" rx="6" fill="rgba(6,78,59,0.8)" stroke="rgba(16,185,129,0.4)"/>
  <text x="190" y="29" fill="#34d399" font-size="11" font-family="monospace">Surgery complete · 4 ghost lines removed</text>

  <!-- Left Explorer -->
  <rect x="0" y="48" width="250" height="740" fill="#0a0a0a" stroke="#1f1f1f"/>
  <text x="15" y="75" fill="#6b7280" font-size="11" font-family="monospace" font-weight="bold">EXPLORER</text>
  <text x="15" y="105" fill="#22d3ee" font-size="12" font-family="monospace">v ai_cart_project</text>
  <text x="30" y="130" fill="#22d3ee" font-size="12" font-family="monospace">v src</text>
  <rect x="45" y="145" width="190" height="24" rx="4" fill="rgba(34,211,238,0.15)"/>
  <text x="50" y="161" fill="#22d3ee" font-size="12" font-family="monospace" font-weight="bold">cart_calculator.py</text>
  <text x="50" y="185" fill="#a1a1aa" font-size="12" font-family="monospace">cart_calculator.py.bak</text>

  <!-- Center Monaco Editor -->
  <rect x="250" y="48" width="870" height="740" fill="#050505" stroke="#1f1f1f"/>
  <text x="275" y="115" fill="#8b5cf6" font-size="13" font-family="monospace">def calculate_cart_total(items, discount):</text>
  <text x="295" y="140" fill="#a1a1aa" font-size="13" font-family="monospace">subtotal = sum(item.price for item in items)</text>
  <text x="295" y="170" fill="#e5e7eb" font-size="13" font-family="monospace">subtotal = subtotal</text>
  <text x="295" y="200" fill="#e5e7eb" font-size="13" font-family="monospace">subtotal = subtotal</text>
  <text x="295" y="230" fill="#e5e7eb" font-size="13" font-family="monospace">subtotal = subtotal</text>
  <text x="295" y="260" fill="#e5e7eb" font-size="13" font-family="monospace">subtotal = subtotal</text>
  <text x="295" y="290" fill="#a1a1aa" font-size="13" font-family="monospace">final_total = subtotal - discount</text>

  <!-- Right Tomography Panel (0 Ghost Lines) -->
  <rect x="1120" y="48" width="320" height="740" fill="#0a0a0a" stroke="#1f1f1f"/>
  <text x="1140" y="80" fill="#ffffff" font-size="14" font-weight="bold">Tomography Panel</text>
  <rect x="1330" y="65" width="90" height="22" rx="11" fill="rgba(16,185,129,0.15)"/>
  <text x="1340" y="80" fill="#10b981" font-size="11" font-family="monospace">Luminance: 1.00</text>

  <rect x="1140" y="100" width="280" height="60" rx="8" fill="#050505" stroke="#1f1f1f"/>
  <text x="1155" y="125" fill="#a1a1aa" font-size="12" font-family="monospace">Causal Impact: <tspan fill="#10b981" font-weight="bold">100.00%</tspan></text>
  <text x="1155" y="145" fill="#a1a1aa" font-size="12" font-family="monospace">Ghost Lines Detected: <tspan fill="#10b981" font-weight="bold">0</tspan></text>

  <rect x="1140" y="180" width="280" height="80" rx="8" fill="#050505" stroke="#1f1f1f"/>
  <text x="1155" y="215" fill="#6b7280" font-size="11" font-family="monospace">No vacuous ghost lines detected.</text>
  <text x="1155" y="235" fill="#10b981" font-size="11" font-family="monospace">Code is causally optimal.</text>
</svg>
